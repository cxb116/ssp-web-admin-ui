# ============================================================
# SSP 管理后台 Nginx 配置（Linux 部署）
# 适用：前端 web-antd 静态资源 + 后端 yudao-server:48080
#
# 建议路径：
#   配置文件: /etc/nginx/conf.d/ssp-admin.conf
#   前端目录: /data/ssp-web/dist
#   日志目录: /var/log/nginx/
#
# 使用前请修改：
#   1. server_name  改成你的域名或服务器 IP
#   2. root         改成前端打包后的实际目录
#   3. proxy_pass   后端地址（同机一般用 127.0.0.1:48080）
#
# 前端打包前建议修改 .env.production：
#   VITE_GLOB_API_URL=/admin-api
#   VITE_BASE_URL=
# 这样接口走同域 Nginx 反代，避免写死 127.0.0.1
# ============================================================

# 如果是独立完整配置可取消下面注释；若放到 conf.d 下，只保留 server 块即可
# worker_processes  auto;
# events {
#     worker_connections  1024;
# }
# http {
#     include       mime.types;
#     default_type  application/octet-stream;
#     sendfile      on;
#     keepalive_timeout  65;

upstream ssp_backend {
    # 后端 Spring Boot 地址，同机部署用 127.0.0.1
    server 127.0.0.1:48080;
    keepalive 32;
}

server {
    listen       80;
    # 改成你的域名或 IP，例如 admin.example.com
    server_name  _;

    # 前端打包产物目录（pnpm build 后 dist 内容拷贝到这里）
    root   /data/ssp-web/dist;
    index  index.html;

    # 访问日志 / 错误日志
    access_log  /var/log/nginx/ssp-admin.access.log;
    error_log   /var/log/nginx/ssp-admin.error.log;

    # 上传体积（导入 Excel 等场景可调大）
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/vnd.ms-fontobject application/x-font-ttf font/opentype
               image/svg+xml;
    gzip_vary on;

    # -------------------- 后端 API 反代 --------------------
    # 管理端接口：/admin-api/**
    location /admin-api/ {
        proxy_pass http://ssp_backend/admin-api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 超时（报表导出等长请求可适当加大）
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 后端返回大文件/流时缓冲
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;
    }

    # WebSocket（若使用消息推送等，可按需开启）
    location /admin-api/ws/ {
        proxy_pass http://ssp_backend/admin-api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 文件预览/下载（若走后端静态资源路径，按实际调整）
    location /admin-api/infra/file/ {
        proxy_pass http://ssp_backend/admin-api/infra/file/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # -------------------- 前端静态资源 --------------------
    # 静态资源长缓存（带 hash 的 js/css）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口：hash 路由也建议保留 try_files，避免刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

